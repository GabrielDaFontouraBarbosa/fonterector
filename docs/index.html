<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Fonterector The Game</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--fundo:#0b0303;--texto:#fecaca;--forte:#fbbf24}
  html,body{margin:0;height:100%;background:var(--fundo);color:var(--texto);font-family:system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}
  h1{margin:0;font:900 clamp(34px,10vw,90px)/1 Impact,'Arial Black',sans-serif;color:var(--forte);text-shadow:0 0 24px #ef4444}
  p{margin:0;max-width:30em}
  a{color:var(--forte)}
</style>
</head>
<body>
<h1>FONTERECTOR</h1>
<p id="msg">Procurando o servidor…</p>
<script>
// O endereço do servidor muda quando o túnel reconecta; tunel.py grava o atual em link.txt.
// Esta página lê o arquivo e manda pra lá, levando junto o ?sala= se tiver.
fetch('link.txt?t=' + Date.now(), { cache: 'no-store' })
  .then(r => r.ok ? r.text() : Promise.reject())
  .then(t => {
    const url = t.trim();
    if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(url)) throw 0;
    location.replace(url + '/' + location.search);
  })
  .catch(() => {
    document.getElementById('msg').innerHTML = 'O servidor está desligado agora. Peça pro Gabriel ligar e recarregue a página.';
  });
</script>
</body>
</html>
